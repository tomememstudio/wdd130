<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>

    <!-- NEW SHORTER META DESCRIPTION (150 chars) -->
    <meta name="description"
        content="Contact White Water Rafting to ask questions, make reservations, or send suggestions. Reach us by phone, email, or our contact form.">

    <!-- META AUTHOR -->
    <meta name="author" content="Tom Emem">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <!-- Header with logo and nav -->
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>
                123 Main River Street<br>
                San Diego, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>
        </section>

        <section class="contact-grid">

            <!-- LEFT: MAP -->
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18....your-map-url-here..." allowfullscreen=""
                    loading="lazy"></iframe>
            </div>

            <!-- RIGHT: FORM -->
            <!-- EXACTLY ONE FORM IN <main> -->
            <form>

                <!-- TEXT INPUT -->
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <!-- EMAIL INPUT -->
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <!-- PURPOSE (NOW RADIO BUTTONS — EXACTLY 3 REQUIRED) -->
                <p>Message Purpose:</p>

                <label for="support">
                    <input type="radio" id="support" name="purpose" value="support" required>
                    Support
                </label>

                <label for="billing">
                    <input type="radio" id="billing" name="purpose" value="billing">
                    Billing
                </label>

                <label for="general">
                    <input type="radio" id="general" name="purpose" value="general">
                    General Inquiry
                </label>

                <!-- TEXTAREA -->
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <!-- CHECKBOX (NOW HAS ID + NAME) -->
                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Sign me up for the newsletter
                </label>

                <!-- SUBMIT BUTTON WITH MEANINGFUL TEXT -->
                <button type="submit">Send Message</button>
            </form>

        </section>

        <section class="team">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Customer Service Lead">
                    <figcaption>Tony | Customer Service Lead</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Technical Specialist">
                    <figcaption>Sarah | Technical Specialist</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Office Manager">
                    <figcaption>Michael | Office Manager</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2025 White Water Rafting Adventures | Tom Emem</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook-icon.png" alt="Facebook"></a>
            <a href="#"><img src="images/twitter-icon.png" alt="Twitter"></a>
            <a href="#"><img src="images/instagram-icon.png" alt="Instagram"></a>
        </nav>
    </footer>

</body>

</html>
