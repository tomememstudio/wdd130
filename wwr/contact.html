<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description"
        content="Contact White Water Rafting Company. Ask questions, make reservations, send suggestions, and learn more about our services. Reach us by phone, email, or our contact form.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <!-- Header with logo and nav -->
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street<br>
                San Diego, California<br>
                +1 999 999 9999<br>
                info@whitewater.com</p>
        </section>

        <section class="contact-grid">
            <!-- LEFT SIDE MAP -->
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18....your-map-url-here..." allowfullscreen=""
                    loading="lazy">
                </iframe>
            </div>

            <!-- RIGHT SIDE FORM -->
            <form>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="purpose">Message Purpose:</label>
                <select id="purpose" name="purpose" required>
                    <option value="" selected disabled>Choose one...</option>
                    <option value="support">Support</option>
                    <option value="billing">Billing</option>
                    <option value="general">General Inquiry</option>
                </select>

                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <label>
                    <input type="checkbox" name="newsletter"> Sign me up for the newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>

        </section>

        <section class="team">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Customer Service Lead">
                    <figcaption>Tony | Customer Service Lead</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Technical Specialist">
                    <figcaption>Sarah | Technical Specialist</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Office Manager">
                    <figcaption>Michael | Office Manager</figcaption>
                </figure>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2025 White Water Rafting Adventures | Tom Emem</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook-icon.png" alt="Facebook"></a>
            <a href="#"><img src="images/twitter-icon.png" alt="Twitter"></a>
            <a href="#"><img src="images/instagram-icon.png" alt="Instagram"></a>
        </nav>
    </footer>
